
name: Build and deploy QR Ops Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qr-ops-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Verify Vercel secrets
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Secret VERCEL_TOKEN ausente" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Secret VERCEL_ORG_ID ausente" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Secret VERCEL_PROJECT_ID ausente" && exit 1)

      - name: Install Vercel CLI
        run: npm install --global vercel@64.5.0

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Link Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Verify Vercel output
        shell: bash
        run: |
          test -f .vercel/output/static/index.html || (echo "Vercel não gerou .vercel/output/static/index.html" && exit 1)

      - name: Deploy prebuilt Flutter Web
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
